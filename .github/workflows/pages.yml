# Publish the landing page and the current pages to GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the published pages
        run: |
          mkdir _site
          cp site/index.html _site/
          for f in hum-3d hum-map sinus3d-integrated verify-rounding; do cp "dist/$f.html" _site/; done
      # versions checked 2026-11-22 (Node.js 24); upload-pages-artifact v3 + deploy-pages v4 failed with
      # "No artifacts named github-pages were found"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
